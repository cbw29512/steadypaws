[build]
  command = "python -m pip install -r requirements.txt && python scripts/fetch_vendor.py && python scripts/build_trackers.py && python scripts/build_site.py && python scripts/build_accessible_pages.py && python scripts/build_packs.py && python scripts/apply_commercial_trust.py && python scripts/inject_google_verification.py"
  publish = "."
  # Netlify ignore commands return 0 to skip a build and 1 to continue.
  # Protect credits by allowing only production deploys to build here.
  ignore = 'test "$CONTEXT" != "production"'

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Return a forced 404 for known sensitive-file and unrelated CMS probe paths.
# These are defense-in-depth rules: the site itself serves only static pet resources.
# Avoid a broad catch-all redirect, which would break valid trackers and PDFs.

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

